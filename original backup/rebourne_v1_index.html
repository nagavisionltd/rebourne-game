<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReBOURNE: Jack Unleashed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            overflow: hidden;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        #gameContainer {
            position: relative;
            width: 1920px;
            height: 720px;
        }

        #gameCanvas {
            display: block;
            border: 2px solid #333;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: 100%;
        }
        
        .game-ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            font-family: 'Courier New', monospace;
            text-align: left;
        }
        
        .health-bar, .energy-bar {
            width: 200px;
            height: 20px;
            border: 2px solid #fff;
            margin: 5px 0;
            position: relative;
            background: #333;
        }
        
        .health-fill {
            height: 100%;
            background: linear-gradient(to right, #ff4444, #ff6666);
            transition: width 0.3s ease;
        }
        
        .energy-fill {
            height: 100%;
            background: linear-gradient(to right, #4444ff, #6666ff);
            transition: width 0.3s ease;
            position: relative;
        }
        
        .energy-fill.pulse {
            animation: energyPulse 0.5s infinite alternate;
        }
        
        @keyframes energyPulse {
            from { opacity: 0.7; }
            to { opacity: 1; }
        }
        
        .cutscene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            flex-direction: column;
            justify-content: center; /* Center vertically */
            align-items: center;   /* Center horizontally */
            z-index: 200;
        }
        
        .cutscene-text {
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 28px;
            text-align: center;
            opacity: 0;
            animation: fadeIn 2s ease-in forwards;
            background-color: rgba(0,0,0,0.7);
            padding: 20px;
            width: 80%;
            text-shadow: 2px 2px 4px #000;
            border-radius: 10px;
        }
        
        .cutscene-skip {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #888;
            font-size: 12px;
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        @keyframes flashRed {
            0%, 100% { background: #000; }
            50% { background: #440000; }
        }
        
        .controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 12px;
            color: #888;
        }
        
        .title-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #000011, #001122);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
        }
        
        .title {
            font-size: 48px;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 10px;
            animation: titleGlow 2s infinite alternate;
        }
        
        .subtitle {
            font-size: 24px;
            color: #ff4444;
            text-shadow: 0 0 10px #ff4444;
            margin-bottom: 40px;
        }
        
        .start-btn {
            padding: 15px 30px;
            font-size: 20px;
            background: #ff4444;
            color: white;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        
        .start-btn:hover {
            background: #ff6666;
            transform: scale(1.05);
        }
        
        @keyframes titleGlow {
            from { text-shadow: 0 0 20px #00ffff; }
            to { text-shadow: 0 0 30px #00ffff, 0 0 40px #00ffff; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div class="title-screen" id="titleScreen">
            <h1 class="title">ReBOURNE</h1>
            <h2 class="subtitle">Jack Unleashed</h2>
            <button class="start-btn" onclick="startGame()">START GAME</button>
        </div>
        
        <canvas id="gameCanvas" width="1920" height="720"></canvas>
        
        <div class="game-ui">
            <div>Dr. Jack</div>
            <div class="health-bar">
                <div class="health-fill" id="healthBar" style="width: 100%;"></div>
            </div>
            <div>Energy</div>
            <div class="energy-bar">
                <div class="energy-fill" id="energyBar" style="width: 0%;"></div>
            </div>
        </div>
        
        <div class="controls">
            A-Light | S-Heavy | E-Interact | Arrows-Move | A+S (Full Energy)-Special
        </div>
        
        <div class="cutscene" id="cutscene">
             <img id="cutsceneImage" src="" style="width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; display: none;">
            <div class="cutscene-text" id="cutsceneText"></div>
            <div class="cutscene-skip">Press SPACE to skip</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameState = 'title';
        let currentLevel = 0;
        let cutsceneTimer = 0;
        let level2EnemySpawnTimer = 0;
        let enemiesToSpawnInLevel2 = 10;
        let gameStarted = false;
        let lastTime = 0;

        const groundLevel = 540;
        const PLAYER_SPEED = 300;
        const JUMP_VELOCITY = -900;
        const GRAVITY = 2880;


        const player = {
            x: 100, y: groundLevel, width: 40, height: 60,
            health: 100, maxHealth: 100, energy: 0, maxEnergy: 100,
            vx: 0, vy: 0, grounded: true, facing: 1,
            state: 'idle',
            attackCombo: 0, attackCooldown: 0, invulnerable: 0,
            lastAttackType: ''
        };
        
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if ((gameState === 'cutscene' || gameState === 'ending') && e.key === ' ') skipCutscene();
        });
        document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
        
        let enemies = [];
        let levelBoss = null;
        let environmentObjects = [];
        let projectiles = [];
        let npc = null;
        let backgroundElements = [];

        class BackgroundElement {
            constructor(type) {
                this.type = type;
                this.x = Math.random() * canvas.width;
                if (type === 'cloud') {
                    this.y = Math.random() * 200;
                    this.width = 100 + Math.random() * 100;
                    this.height = 30 + Math.random() * 30;
                    this.speed = 30 + Math.random() * 30;
                } else { // bird
                    this.y = 100 + Math.random() * 150;
                    this.width = 20;
                    this.height = 10;
                    this.speed = 120 + Math.random() * 120;
                }
            }
            update(deltaTime) {
                this.x -= this.speed * deltaTime;
                if (this.x + this.width < 0) {
                    this.x = canvas.width;
                }
            }
            draw() {
                if (this.type === 'cloud') {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                } else {
                    ctx.fillStyle = '#333';
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + this.width / 2, this.y + this.height);
                    ctx.lineTo(this.x + this.width, this.y);
                    ctx.closePath();
                    ctx.fill();
                }
            }
        }


        class NPC {
            constructor(x, y) {
                this.x = x; this.y = y; this.width = 40; this.height = 60;
                this.speed = 150; this.followDistance = 80;
            }
            update(deltaTime) {
                const distToPlayer = this.x - player.x;
                if (Math.abs(distToPlayer) > this.followDistance) {
                    this.x += Math.sign(player.x - this.x) * this.speed * deltaTime;
                }
            }
            draw() {
                ctx.fillStyle = '#ff69b4';
                ctx.fillRect(this.x - this.width / 2, this.y - this.height, this.width, this.height);
            }
        }

        class Projectile {
            constructor(x, y, vx, vy, type = 'bottle') {
                this.x = x; this.y = y; this.vx = vx; this.vy = vy; this.type = type;
                this.width = type === 'knife' ? 5 : 10;
                this.height = type === 'knife' ? 15 : 20;
                this.rotation = 0; this.gravity = 1200;
            }
            update(deltaTime) {
                this.x += this.vx * deltaTime; 
                this.vy += this.gravity * deltaTime;
                this.y += this.vy * deltaTime;
                this.rotation += 12 * Math.sign(this.vx) * deltaTime;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                let color = '#ccc';
                switch(this.type){
                    case 'bottle': color = '#6A8A6A'; break;
                    case 'chair': color = '#8B4513'; break;
                    case 'lamp': color = '#aab8c2'; break;
                    case 'monitor': color = '#333'; break;
                    case 'knife': color = '#c0c0c0'; break;
                }
                ctx.fillStyle = color;
                ctx.fillRect(-this.width/2, -this.height/2, this.width, this.height);
                ctx.restore();
            }
        }

        class EnvironmentObject {
            constructor(x, y, type) {
                this.x = x; this.y = y; this.type = type;
                this.width = (type==='chair') ? 30 : (type==='lamp') ? 15 : (type==='monitor') ? 25 : 10; 
                this.height = (type==='chair') ? 40 : (type==='lamp') ? 50 : (type==='monitor') ? 20 : 20;
                this.health = 1; 
                if(type === 'laser') this.active = true;
            }
            draw() {
                if (['bottle', 'chair', 'lamp', 'monitor'].includes(this.type)) {
                    let color = '#ccc';
                    switch(this.type){
                        case 'bottle': color = '#6A8A6A'; break;
                        case 'chair': color = '#8B4513'; break;
                        case 'lamp': color = '#aab8c2'; break;
                        case 'monitor': color = '#333'; break;
                    }
                    ctx.fillStyle = color;
                    ctx.fillRect(this.x - this.width/2, this.y - this.height, this.width, this.height);
                } else if (this.type === 'destructible_wall') {
                    ctx.fillStyle = 'rgba(200, 200, 220, 0.5)';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                } else if (this.type === 'laser') {
                    if (Math.floor(Date.now() / 2000) % 2 === 0) { // on for 2s, off for 2s
                        this.active = true;
                        ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                        ctx.fillRect(this.x, 0, this.width, canvas.height);
                    } else {
                        this.active = false;
                    }
                }
            }
        }
        
        class Enemy {
            constructor(x, y, type = 'grunt') {
                this.x = x; this.y = y; this.type = type;
                this.width = type === 'heavy' ? 45 : 35; this.height = type === 'heavy' ? 65 : 55;
                this.health = type === 'grunt' ? 25 : (type === 'heavy' ? 50 : 35);
                this.maxHealth = this.health;
                this.facing = -1; this.state = 'idle'; this.attackCooldown = 0; this.stunned = 0;
                this.speed = (type === 'heavy' ? 18 : (type === 'security' ? 42 : 30));
                this.vy = 0;
            }
            update(deltaTime) {
                if (this.y < groundLevel) { // Dropping in
                    this.vy += GRAVITY * deltaTime;
                    this.y += this.vy * deltaTime;
                    if (this.y >= groundLevel) {
                        this.y = groundLevel;
                    }
                    return;
                }

                if (this.stunned > 0) { this.stunned -= deltaTime * 1000; return; }
                const distToPlayer = this.x - player.x;
                const attackRange = this.type === 'heavy' ? 70 : 60;
                const followRange = 400;
                if (Math.abs(distToPlayer) > followRange) { /* idle */ } 
                else if (Math.abs(distToPlayer) > attackRange) {
                    this.x += (distToPlayer > 0 ? -1 : 1) * this.speed * deltaTime;
                    this.facing = distToPlayer > 0 ? -1 : 1;
                }
                if (Math.abs(distToPlayer) < attackRange && this.attackCooldown <= 0) this.attack();
                if (this.attackCooldown > 0) this.attackCooldown -= deltaTime * 1000;
            }
            attack() {
                const damage = this.type === 'heavy' ? 12 : 8;
                this.attackCooldown = (this.type === 'heavy' ? 1500 : (this.type === 'security' ? 750 : 1000));
                if (Math.abs(this.x - player.x) < this.width && player.invulnerable <= 0) {
                    player.health = Math.max(0, player.health - damage);
                    player.energy = Math.min(player.maxEnergy, player.energy + 3);
                    player.invulnerable = 500;
                    updateUI();
                }
            }
            takeDamage(damage) {
                this.health -= damage; this.stunned = 250;
                if (this.health <= 0) {
                    player.energy = Math.min(player.maxEnergy, player.energy + 10);
                    return true;
                }
                return false;
            }
            draw() {
                let color = this.stunned > 0 ? '#ff9999' : '#ff4444';
                if(this.type === 'heavy') color = this.stunned > 0 ? '#aa6666' : '#884444';
                if(this.type === 'security') color = this.stunned > 0 ? '#6666aa' : '#444488';
                ctx.fillStyle = color;
                ctx.fillRect(this.x - this.width/2, this.y - this.height, this.width, this.height);
                if (this.health < this.maxHealth) {
                    ctx.fillStyle = '#333';
                    ctx.fillRect(this.x - 20, this.y - this.height - 10, 40, 4);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(this.x - 20, this.y - this.height - 10, 40 * (this.health / this.maxHealth), 4);
                }
            }
        }
        
        class Boss extends Enemy {
             constructor(x, y) {
                super(x, y, 'boss');
                this.width = 60; this.height = 80; this.health = 150; this.maxHealth = 150;
            }
            draw() {
                ctx.fillStyle = '#880000';
                ctx.fillRect(this.x - this.width/2, this.y - this.height, this.width, this.height);
                this.drawHealthBar('Security Chief');
            }
            drawHealthBar(name) {
                ctx.fillStyle = '#333';
                ctx.fillRect(canvas.width/2 - 100, 20, 200, 8);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(canvas.width/2 - 100, 20, 200 * (this.health / this.maxHealth), 8);
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.fillText(name, canvas.width/2 - 100, 15);
            }
        }

        class PoliceBoss extends Boss {
            constructor(x, y) {
                super(x, y); this.type = 'police_boss'; this.health = 200; this.maxHealth = 200;
                this.isBlocking = false; this.blockTimer = 3000;
            }
            update(deltaTime) {
                super.update(deltaTime); this.blockTimer -= deltaTime * 1000;
                if (this.blockTimer <= 0) {
                    this.isBlocking = !this.isBlocking;
                    this.blockTimer = this.isBlocking ? 2000 : 3000;
                }
            }
            takeDamage(damage) {
                const inFront = (player.x - this.x) * this.facing > 0;
                if (this.isBlocking && inFront) return false;
                return super.takeDamage(damage);
            }
            draw() {
                ctx.fillStyle = '#444488';
                ctx.fillRect(this.x - this.width/2, this.y - this.height, this.width, this.height);
                if (this.isBlocking) {
                    ctx.fillStyle = '#aaaaaa';
                    ctx.fillRect(this.x + (this.facing * 25), this.y - this.height, 15, this.height);
                }
                this.drawHealthBar('Police Commander');
            }
        }
        
        class AssassinBoss extends Boss {
            constructor(x, y) {
                super(x, y); this.type = 'assassin'; this.health = 180; this.maxHealth = 180;
                this.dodgeCooldown = 0; this.throwCooldown = 2000;
            }
            update(deltaTime) {
                super.update(deltaTime);
                const distToPlayer = this.x - player.x;
                this.speed = 90;
                if (this.dodgeCooldown > 0) this.dodgeCooldown -= deltaTime * 1000;
                if (this.throwCooldown > 0) this.throwCooldown -= deltaTime * 1000;
                if (Math.abs(distToPlayer) < 100 && player.state === 'attacking' && this.dodgeCooldown <= 0) {
                    this.x += Math.sign(distToPlayer) * 100; this.dodgeCooldown = 1500;
                }
                if (this.throwCooldown <= 0) {
                    projectiles.push(new Projectile(this.x, this.y - 40, -360 * this.facing, -240, 'knife'));
                    this.throwCooldown = 2500;
                }
            }
            draw() {
                ctx.fillStyle = '#333333';
                ctx.fillRect(this.x - this.width/2, this.y - this.height, this.width, this.height);
                this.drawHealthBar('Assassin');
            }
        }

        class ExecutiveBoss extends Boss {
             constructor(x, y) {
                super(x, y); this.type = 'executive'; this.health = 250; this.maxHealth = 250;
                this.isCharging = false; this.chargeCooldown = 4000; this.chargeTargetX = 0;
            }
            update(deltaTime) {
                this.chargeCooldown -= deltaTime * 1000;
                if(this.isCharging){
                    this.x += Math.sign(this.chargeTargetX - this.x) * 480 * deltaTime; // Charge speed
                    if(Math.abs(this.x - this.chargeTargetX) < 20){
                        this.isCharging = false;
                        this.stunned = 500;
                    }
                } else {
                    super.update(deltaTime);
                    if(this.chargeCooldown <= 0){
                        this.isCharging = true;
                        this.chargeTargetX = player.x;
                        this.chargeCooldown = 5000;
                    }
                }
            }
            draw() {
                ctx.fillStyle = '#D4AF37'; // Gold/yellow armor
                ctx.fillRect(this.x - this.width/2, this.y - this.height, this.width, this.height);
                if(this.isCharging) {
                     ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
                     ctx.fillRect(0, this.y - this.height, canvas.width, this.height);
                }
                this.drawHealthBar('Executive');
            }
        }

        class HandlerBoss extends Boss {
            constructor(x, y) {
                super(x, y); this.type = 'handler'; this.health = 300; this.maxHealth = 300;
                this.teleportCooldown = 3000;
            }
            update(deltaTime) {
                super.update(deltaTime);
                this.speed = 120;
                this.teleportCooldown -= deltaTime * 1000;
                if (this.teleportCooldown <= 0) {
                    this.x = player.x + (player.facing * -100); // Teleport behind player
                    this.teleportCooldown = 4000;
                }
            }
             draw() {
                ctx.fillStyle = '#6a0dad'; // Purple suit
                ctx.fillRect(this.x - this.width/2, this.y - this.height, this.width, this.height);
                this.drawHealthBar('The Handler');
            }
        }


        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
            document.getElementById('titleScreen').style.display = 'none';
            startOpeningCutscene();
            gameLoop(0);
        }
        
        function startOpeningCutscene() {
            gameState = 'cutscene';
            cutsceneTimer = 7000;
            const cutsceneDiv = document.getElementById('cutscene');
            const textDiv = document.getElementById('cutsceneText');
            cutsceneDiv.style.display = 'flex';
            document.getElementById('cutsceneImage').style.display = 'none';
            textDiv.style.color = '#00ff00';
            textDiv.innerHTML = 'FACILITY LOCKDOWN<br/>SUBJECT CONTAINMENT BREACH<br/>EMERGENCY PROTOCOLS ACTIVATED';
            
            setTimeout(() => {
                if(gameState === 'cutscene' && currentLevel === 0) textDiv.innerHTML = 'SUSPENSION CHAMBER MALFUNCTION<br/>SUBJECT 7 STATUS: AWAKENING';
            }, 3000);
            setTimeout(() => {
                 if(gameState === 'cutscene' && currentLevel === 0) textDiv.innerHTML = 'DR. JACK...<br/>WHAT HAVE THEY DONE TO ME?';
            }, 5000);

        }
        
        function skipCutscene() {
            if (cutsceneTimer) clearTimeout(cutsceneTimer);
            document.getElementById('cutscene').style.display = 'none';
            if (currentLevel === 0) initLevel1();
            else if (currentLevel === 1) initLevel2();
            else if (currentLevel === 2) initLevel3();
            else if (currentLevel === 3) initLevel4();
            else if (currentLevel === 4) initLevel5();
            else if (currentLevel === 5) initLevel6();
            else {
                 gameState = 'title';
                 document.getElementById('titleScreen').style.display = 'flex';
            }
            
            if (gameState === 'cutscene' || gameState === 'ending') gameState = 'playing';
        }
        
        
        function initLevel1() {
            currentLevel = 1; player.x = 100; player.health = 100; player.energy = 0;
            enemies = [ new Enemy(960, groundLevel), new Enemy(1200, groundLevel), new Enemy(1440, groundLevel, 'security') ];
            levelBoss = null; environmentObjects = []; projectiles = []; npc = null; updateUI();
        }

        function initLevel2() {
            currentLevel = 2; player.x = canvas.width / 2; player.health = 100; player.energy = 0;
            enemies = []; levelBoss = null; projectiles = []; npc = null;
            environmentObjects = [];
            enemiesToSpawnInLevel2 = 10;
            level2EnemySpawnTimer = 2000; 
            backgroundElements = [];
            for(let i = 0; i < 10; i++) backgroundElements.push(new BackgroundElement('cloud'));
            for(let i = 0; i < 5; i++) backgroundElements.push(new BackgroundElement('bird'));
            updateUI();
        }

        function initLevel3() {
            currentLevel = 3; player.x = 100; player.health = 100; player.energy = 0;
            enemies = [ new Enemy(1200, groundLevel, 'heavy'), new Enemy(1440, groundLevel, 'security') ];
            levelBoss = null; projectiles = []; npc = null;
            environmentObjects = [ 
                new EnvironmentObject(480, groundLevel, 'chair'), new EnvironmentObject(960, groundLevel, 'lamp'),
                new EnvironmentObject(720, 0, 'destructible_wall')
            ];
            environmentObjects[2].width = 480; environmentObjects[2].height = 360;
            updateUI();
        }

        function initLevel4() {
            currentLevel = 4; player.x = 100; player.health = 100; player.energy = 0;
            enemies = [ new Enemy(1440, groundLevel, 'heavy'), new Enemy(1680, groundLevel, 'security') ];
            levelBoss = null; projectiles = []; npc = new NPC(120, groundLevel);
            environmentObjects = [ new EnvironmentObject(720, groundLevel, 'chair') ];
            updateUI();
        }

        function initLevel5() {
            currentLevel = 5; player.x = 100; player.health = 100; player.energy = 0;
            enemies = [ new Enemy(960, groundLevel, 'security'), new Enemy(1200, groundLevel, 'security') ];
            levelBoss = null; projectiles = []; npc = null;
            environmentObjects = [ new EnvironmentObject(600, groundLevel, 'monitor'), new EnvironmentObject(1320, groundLevel, 'monitor')];
            updateUI();
        }
        
        function initLevel6() {
            currentLevel = 6; player.x = 100; player.health = 100; player.energy = 0;
            enemies = [ new Enemy(960, groundLevel, 'heavy') ];
            levelBoss = null; projectiles = []; npc = null;
            environmentObjects = [ new EnvironmentObject(720, 0, 'laser'), new EnvironmentObject(1440, 0, 'laser') ];
            environmentObjects[0].width = 24; environmentObjects[1].width = 24;
            updateUI();
        }


        function checkLevelCompletion() {
            if(currentLevel === 2 && enemiesToSpawnInLevel2 <= 0 && enemies.length === 0 && !levelBoss) {
                 levelBoss = new PoliceBoss(1680, groundLevel);
            }
            else if (enemies.length === 0 && !levelBoss) {
                if (currentLevel === 1) levelBoss = new Boss(1680, groundLevel);
                else if (currentLevel === 3) levelBoss = new AssassinBoss(1680, groundLevel);
                else if (currentLevel === 4) levelBoss = new ExecutiveBoss(1680, groundLevel);
                else if (currentLevel === 5) levelBoss = new HandlerBoss(1680, groundLevel);
                else if (currentLevel === 6) showLevelCompleteCutscene();
            }
            if (levelBoss && levelBoss.health <= 0) {
                levelBoss = null;
                showLevelCompleteCutscene();
            }
        }
        
        function showLevelCompleteCutscene() {
            gameState = 'cutscene';
            const cutsceneDiv = document.getElementById('cutscene');
            const textDiv = document.getElementById('cutsceneText');
            
            cutsceneDiv.style.display = 'flex';
            textDiv.style.color = '#ffffff';

            let cutsceneText = '';
            
            if (currentLevel === 1) {
                cutsceneText = '"I remember... but this isn\'t right..."';
            } else if (currentLevel === 2) {
                cutsceneText = '"These moves... I never learned them in medical school."';
            } else if (currentLevel === 3) {
                cutsceneText = '"Dr. Jack Morrison... was that ever really my name?"';
            } else if (currentLevel === 4) {
                cutsceneText = '"They made me forget... but why?"';
            } else if (currentLevel === 5) {
                cutsceneText = '"I chose to forget the monster I became..."';
            } else if (currentLevel === 6) {
                cutsceneText = '"...but some things can\'t stay buried."';
            }
            
            textDiv.innerHTML = cutsceneText;
            cutsceneTimer = setTimeout(skipCutscene, 5000);
        }
        
        function handleInput() {
            if (gameState !== 'playing') return;
            player.vx = 0;
            if (player.state !== 'attacking' && player.state !== 'special') {
                if (keys['arrowleft']) { player.vx = -1; player.facing = -1; player.state = 'walking'; }
                else if (keys['arrowright']) { player.vx = 1; player.facing = 1; player.state = 'walking'; }
                else { player.vx = 0; if(player.grounded) player.state = 'idle';}

                if (keys['arrowup'] && player.grounded) { player.vy = JUMP_VELOCITY; player.grounded = false; }
            }
            if (keys['a'] && player.attackCooldown <= 0) {
                if (keys['s'] && player.energy >= player.maxEnergy) performSpecialMove();
                else performLightAttack();
            } else if (keys['s'] && player.attackCooldown <= 0) {
                performHeavyAttack();
            }
            if (keys['e']) {
                keys['e'] = false; // Prevent spamming
                performInteraction();
            }
        }
        
        function performInteraction() {
            for (let i = environmentObjects.length - 1; i >= 0; i--) {
                const obj = environmentObjects[i];
                if (obj.type !== 'destructible_wall' && obj.type !== 'laser' && Math.abs(player.x - obj.x) < 40) {
                    projectiles.push(new Projectile(player.x, player.y - 40, 360 * player.facing, -300, obj.type));
                    environmentObjects.splice(i, 1);
                    return; 
                }
            }
        }

        function performLightAttack() {
            player.state = 'attacking'; player.attackCooldown = 333; player.lastAttackType = 'light';
            player.attackCombo = (player.attackCombo % 5) + 1;
            let damage = player.attackCombo === 4 ? 8 : (player.attackCombo === 5 ? 10 : 5);
            const attackHitbox = { x: player.x + (player.facing * 40), width: 70 };
            
            [...enemies, levelBoss].filter(e => e).forEach((enemy, index) => {
                if (Math.abs(enemy.x - attackHitbox.x) < attackHitbox.width / 2) {
                    if (enemy.takeDamage(damage) && enemy !== levelBoss) enemies.splice(index, 1);
                    player.energy = Math.min(player.maxEnergy, player.energy + 2);
                }
            });
            updateUI();
        }
        
        function performHeavyAttack() {
            player.state = 'attacking'; player.attackCooldown = 666; player.attackCombo = 0; player.lastAttackType = 'heavy';
            const damage = 15;
            const attackHitbox = { x: player.x + (player.facing * 50), width: 90 };
            [...enemies, levelBoss].filter(e => e).forEach((enemy, index) => {
                 if (Math.abs(enemy.x - attackHitbox.x) < attackHitbox.width/2) {
                    if (enemy.takeDamage(damage) && enemy !== levelBoss) enemies.splice(index, 1);
                    player.energy = Math.min(player.maxEnergy, player.energy + 4);
                }
            });
            environmentObjects.forEach((wall, index) => {
                if (wall.type === 'destructible_wall' && attackHitbox.x > wall.x && attackHitbox.x < wall.x + wall.width) {
                    if(--wall.health <= 0) environmentObjects.splice(index, 1);
                }
            });
            updateUI();
        }
        
        function performSpecialMove() {
            player.state = 'special'; player.attackCooldown = 3000; player.energy = 0; player.invulnerable = 3000;
            let primaryTarget = null; let closestDist = 150;
            [...enemies, levelBoss].filter(e => e).forEach(enemy => {
                const dist = enemy.x - player.x;
                if ((player.facing > 0 ? dist > 0 : dist < 0) && Math.abs(dist) < closestDist) {
                    closestDist = Math.abs(dist); primaryTarget = enemy;
                }
            });
            if (primaryTarget) {
                 if (primaryTarget.takeDamage(88) && primaryTarget !== levelBoss) {
                    enemies.splice(enemies.indexOf(primaryTarget), 1);
                 }
            }
            [...enemies, levelBoss].filter(e => e && e !== primaryTarget && Math.abs(e.x - player.x) < 150).forEach(e => {
                if (e.takeDamage(15) && e !== levelBoss) enemies.splice(enemies.indexOf(e), 1);
            });
            const specialHitbox = {x: player.x, width: 300};
            environmentObjects.forEach((wall, index) => {
                if (wall.type === 'destructible_wall' && specialHitbox.x + specialHitbox.width/2 > wall.x && specialHitbox.x - specialHitbox.width/2 < wall.x + wall.width) {
                    if(--wall.health <= 0) environmentObjects.splice(index, 1);
                }
            });
            updateUI();
        }
        
        function updatePlayer(deltaTime) {
            player.x += player.vx * PLAYER_SPEED * deltaTime;
            if (!player.grounded) {
                player.vy += GRAVITY * deltaTime;
                player.y += player.vy * deltaTime;
                if (player.y >= groundLevel) {
                    player.y = groundLevel;
                    player.vy = 0;
                    player.grounded = true;
                }
            }
            player.x = Math.max(player.width/2, Math.min(canvas.width - player.width/2, player.x));
            if (player.attackCooldown > 0) {
                player.attackCooldown -= deltaTime * 1000;
                if(player.attackCooldown <= 0) {
                     player.state = 'idle'; player.attackCombo = 0;
                }
            }
            if (player.invulnerable > 0) player.invulnerable -= deltaTime * 1000;
        }
        
        function updateUI() {
            document.getElementById('healthBar').style.width = `${player.health / player.maxHealth * 100}%`;
            const energyBar = document.getElementById('energyBar');
            energyBar.style.width = `${player.energy / player.maxEnergy * 100}%`;
            energyBar.classList.toggle('pulse', player.energy >= player.maxEnergy);
        }
        
        function drawPlayer() {
            ctx.save();
            if (player.invulnerable > 0 && Math.floor(Date.now() / 100) % 2) {
                ctx.globalAlpha = 0.5;
            }

            ctx.fillStyle = '#4444ff';
            ctx.fillRect(player.x - player.width / 2, player.y - player.height, player.width, player.height);
            
            // Attack visuals
            if (player.state === 'attacking') {
                if (player.lastAttackType === 'light') {
                    ctx.fillStyle = player.attackCombo === 5 ? '#00FFFF' : '#ADD8E6';
                    ctx.fillRect(player.x + (player.facing * 25), player.y - 45, 40, 20);
                } else if (player.lastAttackType === 'heavy') {
                    ctx.fillStyle = '#FFA500';
                    ctx.fillRect(player.x + (player.facing * 30), player.y - 50, 60, 30);
                }
            } else if (player.state === 'special') {
                ctx.fillStyle = 'rgba(255, 255, 0, 0.5)';
                ctx.beginPath();
                ctx.arc(player.x, player.y - player.height / 2, 60, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
        
        function drawLevel1Background() {
            ctx.fillStyle = '#223333'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#334444'; ctx.fillRect(0, groundLevel, canvas.width, canvas.height - groundLevel);
            ctx.strokeStyle = '#445555';
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, groundLevel); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            if (Math.floor(Date.now() / 500) % 2) {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function drawLevel2Background() {
             const skyGradient = ctx.createLinearGradient(0, 0, 0, groundLevel);
             skyGradient.addColorStop(0, '#87CEEB');
             skyGradient.addColorStop(1, '#ADD8E6');
             ctx.fillStyle = skyGradient;
             ctx.fillRect(0, 0, canvas.width, canvas.height);

             backgroundElements.forEach(el => el.draw());

             // Truck
             ctx.fillStyle = '#666';
             ctx.fillRect(0, groundLevel, canvas.width, canvas.height - groundLevel);
             ctx.fillStyle = '#444';
             ctx.fillRect(0, groundLevel, canvas.width, 15);
        }

        function drawLevel3Background() {
            ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#8B4513'; ctx.fillRect(0, groundLevel, canvas.width, canvas.height - groundLevel);
            ctx.fillStyle = '#1a1a2a'; ctx.fillRect(720, 0, 480, 360);
            ctx.fillStyle = '#ffffff';
            for(let i=0; i<30; i++) ctx.fillRect(720 + Math.random()*480, Math.random()*360, 2, 2);
        }
        
        function drawLevel4Background() {
            ctx.fillStyle = '#5D6D7E'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#EAECEE'; ctx.fillRect(0, groundLevel, canvas.width, canvas.height-groundLevel);
            ctx.strokeStyle = '#BDC3C7';
            for(let i = 0; i < 10; i++){
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, groundLevel + Math.random() * (canvas.height - groundLevel));
                ctx.lineTo(Math.random() * canvas.width, groundLevel + Math.random() * (canvas.height - groundLevel));
                ctx.stroke();
            }
            ctx.fillStyle = '#D35400'; ctx.fillRect(840, 90, 240, 270);
            ctx.fillStyle = '#F4D03F'; ctx.fillRect(864, 108, 192, 234);
        }

        function drawLevel5Background() {
            ctx.fillStyle = '#34495e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#7f8c8d'; ctx.fillRect(0, groundLevel, canvas.width, canvas.height - groundLevel);
            ctx.strokeStyle = '#95a5a6';
            for(let x = 240; x < 1680; x += 360) {
                ctx.strokeRect(x, 360, 240, 180);
            }
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(1680, 270, 120, 270);
        }

        function drawLevel6Background() {
            ctx.fillStyle = '#1C1C1C'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            for(let i=0; i<20; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random()*canvas.width, 0);
                ctx.lineTo(Math.random()*canvas.width, canvas.height);
                ctx.stroke();
            }
            ctx.fillStyle = '#333'; ctx.fillRect(0, groundLevel, canvas.width, canvas.height - groundLevel);
        }

        function drawBeachBackground() {
            ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFD700';
            ctx.beginPath(); ctx.arc(240, 180, 72, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#00BFFF'; ctx.fillRect(0, 450, canvas.width, canvas.height - 450);
            ctx.fillStyle = '#F0E68C'; ctx.fillRect(0, groundLevel, canvas.width, canvas.height - groundLevel);
        }

        function drawEndingScene() {
            cutsceneTimer -= 1000/60;
            drawBeachBackground();

            player.x = canvas.width / 2;
            player.y = groundLevel;
            
            ctx.fillStyle = '#4444ff';
            ctx.fillRect(player.x - player.width/2, player.y - player.height, player.width, player.height);
            
            ctx.fillStyle = '#000000';
            ctx.fillRect(player.x - 15, player.y - 55, 30, 10);

            ctx.fillStyle = '#000000';
            ctx.font = '36px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText("Finally... free.", canvas.width / 2, 150);

            if (cutsceneTimer <= 0) {
                gameState = 'title';
                document.getElementById('titleScreen').style.display = 'flex';
                currentLevel = 0; 
            }
        }


        function gameLoop(currentTime) {
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            if (gameState === 'title') {
                 // The loop is running, but we wait for the user to click "Start Game"
            } else if (gameState === 'cutscene' && currentLevel === 0) {
                cutsceneTimer -= deltaTime * 1000;
                if (cutsceneTimer <= 0) {
                    skipCutscene();
                }
            } else if (gameState === 'ending') {
                drawEndingScene();
            } else if (gameState === 'playing') {
                handleInput();
                updatePlayer(deltaTime);
                if (npc) npc.update(deltaTime);

                if (currentLevel === 2) {
                    backgroundElements.forEach(el => el.update(deltaTime));
                    level2EnemySpawnTimer -= deltaTime * 1000;
                    if(level2EnemySpawnTimer <= 0 && enemiesToSpawnInLevel2 > 0) {
                        enemies.push(new Enemy(Math.random() * (canvas.width - 200) + 100, -50));
                        enemiesToSpawnInLevel2--;
                        level2EnemySpawnTimer = 3000 + Math.random() * 2000;
                    }
                }


                projectiles.forEach((p, pIndex) => {
                    p.update(deltaTime);
                    let hit = false;
                    if (p.type === 'knife' && Math.abs(p.x - player.x) < 20 && Math.abs(p.y - (player.y - player.height/2)) < player.height/2) {
                        player.health = Math.max(0, player.health - 10);
                        player.invulnerable = 500; updateUI(); hit = true;
                    } else {
                         [...enemies, levelBoss].filter(e => e).forEach((enemy, eIndex) => {
                            if (Math.abs(p.x - enemy.x) < (p.width + enemy.width) / 2) {
                                if (enemy.takeDamage(10) && enemy !== levelBoss) enemies.splice(eIndex, 1);
                                hit = true;
                            }
                        });
                    }
                    if (hit || p.x < 0 || p.x > canvas.width || p.y > groundLevel) projectiles.splice(pIndex, 1);
                });
                
                environmentObjects.forEach(obj => {
                    if(obj.type === 'laser' && obj.active && Math.abs(player.x - (obj.x + obj.width/2)) < player.width/2) {
                        player.health = 0; updateUI(); // Instant death
                    }
                });

                enemies.forEach(e => e.update(deltaTime));
                if (levelBoss) levelBoss.update(deltaTime);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (currentLevel === 1) drawLevel1Background();
                else if (currentLevel === 2) drawLevel2Background();
                else if (currentLevel === 3) drawLevel3Background();
                else if (currentLevel === 4) drawLevel4Background();
                else if (currentLevel === 5) drawLevel5Background();
                else if (currentLevel === 6) drawLevel6Background();
                
                projectiles.forEach(p => p.draw());
                environmentObjects.forEach(obj => obj.draw());
                if(npc) npc.draw();
                enemies.forEach(e => e.draw());
                if (levelBoss) levelBoss.draw();
                drawPlayer();
                
                checkLevelCompletion();
            }
            
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
